<!DOCTYPE html>
<html>
<head>
  <title>Covergrid</title>
  <style>
body {
  background-color: #f5f5f5;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
}

.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  grid-gap: 30px;
  padding: 10px 40px 0 40px;
  max-width: 98%;
  margin: 0 auto;
  width: 750px;
  transition: transform 0.3s ease;
  transform-origin: top center;
  scale: 0.8;
}

.cover {
  position: relative;
  overflow: hidden;
  box-shadow: 0 6px 12px rgba(0, 0, 0, 0.7);
  transition: transform 0.3s ease;
  margin: 0;
  padding: 0;
  border-radius: 10px; /* Ensure the cover wrapper has rounded corners */
}

.cover:hover {
  transform: translateY(-5px);
}

.cover img {
  height: 100%;
  width: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
  margin: 0;
  border-radius: 10px; /* Ensure the cover has rounded corners */
}

.header-bar {
	display: flex;
	background-color: #f0f0f0;
	padding: 10px 0 0 0;
	width: 100%;
	color: #111;
}
.header-wrapper {
	flex: 1;
	display: flex;
	flex-direction: column; /* Stack elements vertically */
	align-items: center;
	justify-content: center;
	gap: 10px; /* Add some space between elements */
}

.header-bar img {
		max-height: 100px;
	}
label {
		margin-right: 10px;
	}
input[type="range"] {
		margin-left: 10px;
	}
	
.cover .remove-button {
    position: absolute;
    top: 10px;
    right: 10px;
    background-color: black;
    color: white;
    border: none;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    display: none; /* Hide by default */
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.cover:hover .remove-button {
    display: flex; /* Show on hover */
}

#error-message {
    position: absolute;
    top: 100px;
    left: 0; /* Stretch left */
    right: 0; /* Stretch right */
    color: red;
    text-align: center;
    margin-top: 20px;
    opacity: 0; /* Start as transparent */
    transition: opacity 0.5s ease, visibility 0.5s ease; /* Transition for fading */
    visibility: hidden; /* Initially hidden */
    background-color: rgba(255, 255, 255, 0.8); /* Optional: semi-transparent background */
    padding: 10px;
    z-index: 10;
}

#error-message.visible {
    visibility: visible; /* Make it visible */
    opacity: 1; /* Fully visible */
}

.fade-out {
    opacity: 0; /* Fully transparent */
    visibility: hidden; /* Hide after fading out */
}

.theme-selection {
    display: flex;
    gap: 4px; /* Space between theme boxes */
    align-items: center; /* Vertically align items in the center */
}

.theme-box {
    cursor: pointer; /* Pointer cursor on hover */
    border-radius: 5px; /* Optional: rounded corners */
    transition: transform 0.25s; /* Smooth scaling effect */
}

.theme-box:hover {
    transform: scale(1.1); /* Scale up on hover */
}


  </style>
</head>
<body>

    <div class="header-bar">
		<div class="header-wrapper">
			<div>
				<label for="container-width">Container Width:</label>
				<input type="range" id="container-width" min="300" max="1800" value="750"/>
			</div>
			<div>
				<label for="zoom-level">Zoom Level:</label>
				<input type="range" id="zoom-level" min="0.2" max="2.9" step="0.1" value="1"/>
			</div>
			<div>
				<a href="#" onclick="clearGrid(); return false;">clear grid</a>
			</div>
		</div>
        <div class="header-wrapper">
			<img src="covergrid_logo.png" alt="Header Image" />
		</div>
        <div class="header-wrapper">
			<div>Background/Border Themes:</div>
			<div id="theme-selector">
			</div>			
		    <a href="https://github.com/kmfd/covergrid">https://github.com/kmfd/covergrid</a>
		</div>
    </div>
  <div id="error-message" style="color: red; text-align: center; margin-top: 20px;"></div>
	<div class="container" id="covers"></div>
	
 <script>

// ----------------------------------
// Initialization and Setup Functions
// ----------------------------------




function initializeCovers() {
    const container = document.getElementById('covers');
    const imagesFromParams = getUrlParams();

    // Populate grid with images from URL parameters
    imagesFromParams.forEach(src => {
        addImage(src);
    });

    if (imagesFromParams.length === 0) {
        // Fetch covers from the server if no images in URL parameters
        getCovers().then(covers => {
            if (covers.length === 0) {
                addImage('no-cover.png');
            } else {
                covers.forEach(cover => loadImage(`covers/${cover}`, container));
            }
        });
    }
	
    updateUrl(); // Update the params with the current urls
}

function getUrlParams() {
	const params = new URLSearchParams(window.location.search);
	const imageUrlsTemp = [];
	for (const [key, value] of params.entries()) {
		if (key.startsWith('image')) {
			imageUrlsTemp.push(value);
		}
	}
	return imageUrlsTemp;
}

// Function to update the URL with image data and URLs
function updateUrl() {
    var baseUrl = window.location.origin + window.location.pathname;
    var params = new URLSearchParams();
    
    // Get the container element
    const container = document.getElementById('covers');
    
    // Gather image sources from the current grid
    const images = container.querySelectorAll('.cover img');
    images.forEach((img, index) => {
        if (img.alt !== 'no-cover.png') {
            params.append('image' + index, img.src); // Use img.src to get the actual URL
        }
    });
    
    var newUrl = baseUrl + (params.toString() ? '?' + params.toString() : ''); // Only add params if present
    window.history.replaceState(null, '', newUrl); // Update the URL without reloading
}

// Fetch covers from the server
function getCovers() {
	return fetch('get_covers.php')
		.then(response => {
			if (!response.ok) {
				console.warn("Error: Resource not found or other error occurred. Status:", response.status);
				return [];
			}
			return response.text();
		})
		.then(text => {
			try {
				return JSON.parse(text);
			} catch (error) {
				console.warn("Failed to parse JSON:", error);
				return [];
			}
		})
		.catch(error => {
			console.error("Fetch error:", error);
			return [];
		});
}

// ----------------------------------
// Image Handling Functions
// ----------------------------------


// Function to load an image (either data URL or URL)
function addImage(src, destinationSlot) {
    console.log("adding image");
    //console.log("destination slot: " + destinationSlot);
    const container = document.getElementById('covers');
    removeNoCoverImage();

    const img = document.createElement('img');
    img.src = src;
    img.alt = src;

    // Create the book cover div
    const newCover = document.createElement('div');
    newCover.classList.add('cover');

    // Create the remove button
    const removeButton = document.createElement('button');
    removeButton.classList.add('remove-button');
    removeButton.innerText = 'X';

    // Add event listener to remove the cover from grid and urls list
    removeButton.addEventListener('click', function () {
        container.removeChild(newCover);
        updateUrl(); // Update the URL after removal
    });

    function moveImage(draggedImage, destinationSlot) {
        const container = document.getElementById('imageContainer'); // Assuming a container ID
        const covers = container.children; // Get all cover elements
        const draggedIndex = Array.from(covers).indexOf(draggedImage.parentElement); // Get the index of the dragged image

        // Update the src of the dragged image's cover to no-cover.png
        updateCoverSrc(draggedIndex, 'no-cover.png');

        // Slide covers down if necessary
        slideCoversDown(draggedIndex, destinationSlot, covers);

        // Replace the src of the destination cover with the dragged image's src
        const targetIndex = parseInt(destinationSlot, 10);
        if (covers[targetIndex]) {
            updateCoverSrc(targetIndex, draggedImage.src);
        }
    }

    function updateCoverSrc(index, newSrc) {
        const cover = container.children[index];
        if (cover) {
            const img = cover.querySelector('img'); // Assuming each cover has an img element
            img.src = newSrc; // Update the src
        }
    }

    function slideCoversDown(draggedIndex, destinationSlot, covers) {
        const targetIndex = parseInt(destinationSlot, 10);
        const start = Math.min(draggedIndex, targetIndex);
        const end = Math.max(draggedIndex, targetIndex);

        for (let i = start; i < end; i++) {
            updateCoverSrc(i, 'no-cover.png'); // Set the src to no-cover.png
        }
    }

    function replaceCovers(draggedImages) {
        const covers = container.children;
        for (let i = 0; i < covers.length; i++) {
            const img = covers[i].querySelector('img');
            if (img.src === 'no-cover.png' && draggedImages.length > 0) {
                img.src = draggedImages.shift(); // Replace with the next dragged image src
            }
        }
    }



	// Image loading success
	img.onload = function() {

		newCover.appendChild(img);
		newCover.appendChild(removeButton);
		//console.log("Destination Slot Index is: " + destinationSlot);

		// Check if a destination slot index is provided
		if (destinationSlot !== null && destinationSlot !== undefined) {
			const targetIndex = parseInt(destinationSlot, 10); // Ensure it's an integer
			const targetSlot = container.children[targetIndex];

			if (targetSlot) {
				console.log("Inserting new cover before the specified destination slot at index:", targetIndex);
				container.insertBefore(newCover, targetSlot);
			} else {
				console.log("Destination slot index out of bounds, adding new cover to the end of the container.");
				container.appendChild(newCover);
			}
		} else {
			console.log("No destination slot index provided, adding new cover to the end of the container.");
			container.appendChild(newCover);
		}

		updateUrl(); // Update the params with the current urls
	};

    // Handle image loading error
    img.onerror = function() {
        const errorMessageDiv = document.getElementById('error-message');
        errorMessageDiv.innerText = `Image failed to load, possibly source does not allow remote loading. Please check the console or network tab of dev-tools for details.`;
        
        // Show the error message for 2 seconds
        errorMessageDiv.classList.add('visible');
        setTimeout(() => {
            // Remove the error message and reset
            errorMessageDiv.classList.add('fade-out');
            setTimeout(() => {
                errorMessageDiv.classList.remove('fade-out');
                errorMessageDiv.classList.remove('visible');
            }, 500);
        }, 2000);
    };

    // Start loading the image
    img.src = src; // This line actually triggers the loading
}

// Function to remove "no-cover.png" if it exists on the grid
function removeNoCoverImage() {
	const container = document.getElementById('covers');
	const noCoverElement = Array.from(container.children).find(child => child.querySelector('img').alt === 'no-cover.png');
	if (noCoverElement) {
		container.removeChild(noCoverElement);
	}
}


// Function to trigger the click event for each grid item to clear the grid
function clearGrid() {
	const container = document.getElementById('covers');
	const removeButtons = container.querySelectorAll('.remove-button');
	removeButtons.forEach(button => {
		button.click(); 
	});
}




// ----------------------------------
// UI Control Functions
// ----------------------------------

// grid width control
function updateContainerWidth(value) {
	const container = document.getElementById('covers');
	container.style.width = `${value}px`;
}

// grid zoom control
function updateZoomLevel(value) {
	const container = document.getElementById('covers');
	container.style.transform = `scale(${value})`;
}


// ----------------------------------
// Event Handling
// ----------------------------------

function handleFiles(files, destinationSlot) {
    Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = () => {
            addImage(reader.result, destinationSlot); // Use the loaded image data
        };
        reader.readAsDataURL(file);
    });
}

function handleHtmlSnippet(html_snippet, destinationSlot) {
	// Create a Set to store unique image URLs
			const uniqueImageUrls = new Set();


			// Create a temporary DOM element to parse the HTML
			const tempDiv = document.createElement('div');
			tempDiv.innerHTML = html_snippet;
			// Find all image elements within the parsed HTML
			const imgElements = tempDiv.querySelectorAll('img');

			// Check if there are any images, load all of them
			if (imgElements.length > 0) {
				imgElements.forEach((imgElement, index) => {
					console.log(`Image ${index + 1}: ${imgElement.src}`);
					
					// Check if the image source is already added
					if (!uniqueImageUrls.has(imgElement.src)) {
						// Check if the image is already in the grid
						removeExistingImage(imgElement.src)
						addImage(imgElement.src, destinationSlot);
						uniqueImageUrls.add(imgElement.src); // Add the source to the set
					} else {
						console.log(`Duplicate image source ignored: ${imgElement.src}`);
					}
				});
			}
}

function handleUrl(url, x, y) {
    // Check if the image is already in the grid
    const existingCover = Array.from(document.querySelectorAll('.cover img')).find(img => img.src === url);
    if (existingCover) {
        // Remove the existing image from the grid
        const coverDiv = existingCover.parentElement; // Get the parent div of the image
        coverDiv.parentElement.removeChild(coverDiv); // Remove the cover div
    }
    
    addImage(url, destinationSlot); // Pass x and y coordinates
    updateUrl();
}


function removeExistingImage(src) {
    const existingCover = Array.from(document.querySelectorAll('.cover img')).find(img => img.src === src);
    if (existingCover) {
        // Remove the existing image from the grid
        const coverDiv = existingCover.parentElement; // Get the parent div of the image
        coverDiv.parentElement.removeChild(coverDiv); // Remove the cover div
    }
}

// Function to find the closest grid index based on drop coordinates
function findClosestGridIndex(x, y, container) {
    let closestIndex = null;
    let closestDistance = Infinity;

    //console.log("Finding closest grid index for coordinates:", { x, y });

    Array.from(container.children).forEach((child, index) => {
        const rect = child.getBoundingClientRect();
        const childCenterX = rect.left + rect.width / 2;
        const childCenterY = rect.top + rect.height / 2;

        // Calculate the distance from the drop coordinates to the center of the child element
        const distance = Math.sqrt(Math.pow(childCenterX - x, 2) + Math.pow(childCenterY - y, 2));

        //console.log(`Child index: ${index}, Center: (${childCenterX}, ${childCenterY}), Distance: ${distance}`);

        // Check if this child is closer than the previously found closest
        if (distance < closestDistance) {
            closestDistance = distance;
            closestIndex = index;
            console.log(`New closest index: ${closestIndex} with distance: ${closestDistance}`);
        }
    });

    console.log("Final closest index:", closestIndex);
    return closestIndex;
}



function updateCoverSrc(index, newSrc) {
    const container = document.getElementById('covers'); // Ensure we have the container reference
    const cover = container.children[index];
    if (cover) {
        const img = cover.querySelector('img'); // Assuming each cover has an img element
        img.src = newSrc; // Update the src
    }
}

function slideCoversDown(draggedIndex, destinationSlot, covers) {
    const targetIndex = parseInt(destinationSlot, 10);
    const start = Math.min(draggedIndex, targetIndex);
    const end = Math.max(draggedIndex, targetIndex);

    for (let i = start; i < end; i++) {
        updateCoverSrc(i, 'no-cover.png'); // Set the src to no-cover.png
    }
}

function replaceCovers(draggedImages) {
    const container = document.getElementById('covers'); // Ensure we have the container reference
    const covers = container.children;
    for (let i = 0; i < covers.length; i++) {
        const img = covers[i].querySelector('img');
        if (img.src === 'no-cover.png' && draggedImages.length > 0) {
            img.src = draggedImages.shift(); // Replace with the next dragged image src
        }
    }
}

function moveImage(draggedImage, destinationSlot) {
    const container = document.getElementById('covers'); // Assuming a container ID
    const covers = container.children; // Get all cover elements
    const draggedIndex = Array.from(covers).indexOf(draggedImage.parentElement); // Get the index of the dragged image

    // Update the src of the dragged image's cover to no-cover.png
    updateCoverSrc(draggedIndex, 'no-cover.png');

    // Slide covers down if necessary
    slideCoversDown(draggedIndex, destinationSlot, covers);

    // Replace the src of the destination cover with the dragged image's src
    const targetIndex = parseInt(destinationSlot, 10);
    if (covers[targetIndex]) {
        updateCoverSrc(targetIndex, draggedImage.src);
    }
}
// Initialization
window.onload = function () {
	
	function setupThemes() {
		// Define the themes with corresponding CSS files
		const themes = [
			{ name: 'Light Theme', file: 'css/light-theme.css' },
			{ name: 'Colorful Theme', file: 'css/colorful-theme.css' },
			{ name: 'Dark Theme', file: 'css/dark-theme.css' },
			{ name: 'Cute Theme', file: 'css/cute-theme.css' },
			{ name: 'Minimalist Theme', file: 'css/minimalist-theme.css' },
			{ name: 'Nature Theme', file: 'css/nature-theme.css' },
			{ name: 'Vintage Theme', file: 'css/vintage-theme.css' },
			{ name: 'Neon Theme', file: 'css/neon-theme.css' },
			{ name: 'Monochrome Theme', file: 'css/monochrome-theme.css' },
		//	{ name: 'Ocean/Beach Theme', file: 'css/ocean-theme.css' },
		//	{ name: 'Space Theme', file: 'css/space-theme.css' },
		//	{ name: 'Fantasy Theme', file: 'css/fantasy-theme.css' },
		//	{ name: 'Tech/Modern Theme', file: 'css/tech-theme.css' },
			// Add more themes as needed
		];

		const themeSelectionContainer = document.getElementById('theme-selector')

	async function loadThemesSequentially(themes) {

		for (const theme of themes) {
			
			// Create the theme box
			const themeBox = document.createElement('div');
			themeBox.className = 'theme-box';
				
			try {
				// Fetch the CSS file as text
				const response = await fetch(theme.file);
				if (!response.ok) {
					throw new Error(`Failed to load ${theme.name}`);
				}
				const cssText = await response.text();

				// Debugging: Log the CSS text
				console.log(`CSS Text for ${theme.name}:`, cssText);

									   

				// Use regular expressions to find all border and background styles
				const borderBackgroundMatch = cssText.match(/(border|background)[^;]*/g);
				// Log the matches found
				console.log("Matches found:", borderBackgroundMatch);

				if (borderBackgroundMatch) {
					borderBackgroundMatch.forEach(property => {
						//console.log(property);
						
						// Split the property string to get the name and value
						const [propertyName, value] = property.split(':').map(item => item.trim());

						// Log the extracted property name and value
						console.log(`Extracted Property: ${propertyName}, Value: ${value}`);

						// Apply the property to the themeBox
						themeBox.style[propertyName] = value; // Set the style dynamically
					});
				}

				
				// Log the extracted styles
				console.log(`Applied styles to themeBox:`, themeBox.style.cssText);

				// Set additional styles for visibility
				themeBox.style.width = '25px'; // Set a fixed width for visibility
				themeBox.style.height = '25px'; // Set a fixed height for visibility
				themeBox.style.margin = '4px'; // Add some margin for spacing
				themeBox.style.display = 'inline-block'; // Display boxes inline

				// Create a link element for the theme
				const link = document.createElement('link');
				link.rel = 'stylesheet';
				link.href = theme.file;
				link.dataset.themeName = theme.name; // Store the theme name for later use

				// Set up click event to apply the theme
				themeBox.onclick = () => {
					console.log(`Applying ${theme.name}...`); // Log theme application
					applyTheme(link); // Pass the link element to apply the theme
				};

				// Append the theme box to the container
				themeSelectionContainer.appendChild(themeBox);
			} catch (error) {
				console.error(error);
			}
		}
	}

	// Call the function with the themes array
	loadThemesSequentially(themes);

	}

	// Function to apply the selected theme
	function applyTheme(link) {
		// Remove any previously applied theme styles
		const existingStyle = document.querySelector('link[rel="stylesheet"][data-applied="true"]');
		if (existingStyle) {
			// console.log(`Removing previously applied theme: ${existingStyle.dataset.themeName}`); // Log removal
			existingStyle.remove();
		}

		// Disable all theme links
		const allLinks = document.querySelectorAll('link[rel="stylesheet"]');
		allLinks.forEach(l => {
			l.dataset.applied = "false"; // Mark all as not applied
		});

		// Enable the clicked theme's CSS file
		link.dataset.applied = "true"; // Mark the selected theme as applied
		document.head.appendChild(link); // Re-attach the link to apply the theme
	}

	// Call the setupThemes function to initialize the theme selection
	setupThemes();

	
    initializeCovers();

    // Event listener for the grid width slider
    document.getElementById('container-width').addEventListener('input', function () {
        updateContainerWidth(this.value);
    });

    // Event listener for the grid zoom slider
    document.getElementById('zoom-level').addEventListener('input', function () {
        updateZoomLevel(this.value);
    });

    // Event listener for the dragover event
    document.addEventListener('dragover', event => {
        event.preventDefault(); // Prevent default to allow drop
    });

    // Event listener for the drop event
    document.addEventListener('drop', event => {
        event.preventDefault(); // Prevent default
        //console.log(event.dataTransfer.getData("text/html").toString());
        //console.log(event.dataTransfer.getData('text/uri-list').toString());

        const files = event.dataTransfer.files;

        // Get the container element
        const container = document.getElementById('covers');
        const containerRect = container.getBoundingClientRect();

        // Get the x and y coordinates of the drop event
        const x = event.clientX;
        const y = event.clientY;

        // Initialize source and target grid indices
        let sourceGridIndex = null;
        let destinationSlot = null;

        // Identify the dragged element if it has a grid index
        const draggedElementId = event.dataTransfer.getData("text/plain"); // Assuming the ID of the dragged element is stored in plain text
        const draggedElement = document.getElementById(draggedElementId);
        if (draggedElement) {
            sourceGridIndex = Array.from(container.children).indexOf(draggedElement);
            console.log("Source grid index:", sourceGridIndex);
        }

        // Find the closest grid item to the drop coordinates
        destinationSlot = findClosestGridIndex(x, y, container);
        console.log("Target grid index:", destinationSlot);

        // If an image was dragged from one slot to another, move it
        if (draggedElement && sourceGridIndex !== null && destinationSlot !== null && sourceGridIndex !== destinationSlot) {
            moveImage(draggedElement, destinationSlot);

        } else if (files.length > 0) {
            // Handle file drops
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = () => {
                    addImage(reader.result, destinationSlot); // Use the loaded image data
                };
                reader.readAsDataURL(file);
            });

        } else if (event.dataTransfer.getData("text/html")) {
            // Handle image or html snippet drops
            const html_snippet = event.dataTransfer.getData("text/html");
            handleHtmlSnippet(html_snippet, destinationSlot);

        } else if (event.dataTransfer.getData('text/uri-list')) {
            // Handle straightforward URL drops
            const url = event.dataTransfer.getData('text/uri-list');
            handleUrl(url, destinationSlot);
        } else if (event.dataTransfer.getData('text/plain')) {
            // Handle plain text drops (if needed)
            const text = event.dataTransfer.getData('text/plain');
            console.log("Dropped text:", text);
        }
    });
}
	


</script>
